services:
  database:
    container_name: messenger-dev-database
    image: postgres:18
    environment:
      POSTGRES_DB: dev_database
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5544:5432"
    volumes:
      - "db_data:/var/lib/postgresql"
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U developer -d dev_database" ]
      interval: 5s
      timeout: 15s
      retries: 5

volumes:
  db_data:
